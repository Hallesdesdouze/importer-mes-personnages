<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Export Personnages Dofus</title>
  <link rel="stylesheet" href="/public/tailwind.css">
</head>
<body class="bg-slate-50 min-w-125 rounded overflow-hidden box-border">
    <header class="bg-slate-800">
        <div class="container mx-auto p-5 flex items-center justify-between">
            <img src="/public/import.png" width="150" alt="Halles des Douze">
            <div class="flex flex-col items-end">
                <span class="text-slate-200 font-bold text-sm">Importer mes personnages</span>
                <a href="a-propos.html" target="_blank" class="text-slate-300 text-xs hover:text-lime-500 transition-colors">À propos de cette extension</a>
            </div>
        </div>
    </header>

    <div class="p-5 flex flex-col gap-4">
        <div id="status" class="hidden items-start gap-3 rounded-lg border p-3 text-xs leading-relaxed">
            <span id="statusIcon" class="shrink-0 mt-0.5"></span>
            <div id="statusText" class="whitespace-pre-line"></div>
        </div>

        <div id="successBar" class="hidden items-center justify-between gap-3 rounded-lg border border-lime-200 bg-lime-50 p-3">
            <div class="text-xs text-slate-700 leading-snug">
                <p>Compte détecté : <span class="font-semibold text-slate-900" id="nicknameOut"></span></p>
                <p>Personnages détectés : <span class="font-semibold text-slate-900" id="countOut"></span></p>
            </div>
            <button type="button" id="submitBtn"
                class="cursor-pointer shrink-0 bg-lime-500 hover:bg-lime-500/80 active:scale-95 transition rounded p-3 text-white text-xs font-medium whitespace-nowrap">
                Importer le compte
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
